server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem isto, atualizar a página em /tickets/algum-id devolveria 404: o
    # Nginx procuraria um arquivo literal chamado "tickets/algum-id" no
    # disco, que não existe — só existe a ROTA "/tickets/:id" dentro do
    # JavaScript do React Router. `try_files` garante que qualquer caminho
    # que não bate com um arquivo real cai de volta em index.html, e o
    # roteador do lado do cliente assume a partir daí.
    location / {
        try_files $uri /index.html;
    }
}
